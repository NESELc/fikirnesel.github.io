  <!-- (Geri kalan meta ve CSS kodlarınız aynı kalıyor, sadece markaModal kısmını değiştirin) -->
  <style>
    /* Mevcut CSS yapınız aynen korunmuştur... */
    .marka-listesi{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important;width:100%!important}

<body>
<!-- HEADER VE MAIN BÖLÜMÜNÜZ AYNI KALACAK, sadece markaModal içindeki div'i boşaltın -->

<div id="markaModal">
  <h4>🚘 Marka Resmi Siteleri</h4>
  <div class="marka-listesi" id="markaListe">
    <!-- Burası JS ile otomatik dolacak -->
  </div>
